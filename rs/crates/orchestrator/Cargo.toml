[package]
name = "lifescape-orchestrator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[lib]
name = "lifescape_orchestrator"
path = "src/lib.rs"

[dependencies]
lifescape-json = { path = "../json" }
lifescape-gamedata = { path = "../gamedata" }
lifescape-nav = { path = "../nav" }
lifescape-sdk = { path = "../sdk" }
lifescape-scripts = { path = "../scripts" }
lifescape-market = { path = "../market" }
lifescape-planner = { path = "../planner" }
lifescape-store = { path = "../store" }
lifescape-orch-daemon = { path = "../orch-daemon" }
lifescape-orch-web = { path = "../orch-web" }
lifescape-orch-brain = { path = "../orch-brain" }
lifescape-orch-session = { path = "../orch-session" }
lifescape-orch-stats = { path = "../orch-stats" }
lifescape-orch-market = { path = "../orch-market" }
lifescape-orch-fleet = { path = "../orch-fleet" }
lifescape-orch-world = { path = "../orch-world" }
lifescape-orch-core = { path = "../orch-core" }

[dev-dependencies]
# Test isolation (see orch-core `test-isolation`): run/ state resolves to a temp root.
lifescape-orch-core = { path = "../orch-core", features = ["test-isolation"] }
lifescape-sdk = { path = "../sdk", features = ["test-isolation"] }
lifescape-store = { path = "../store", features = ["test-isolation"] }
lifescape-orch-market = { path = "../orch-market", features = ["test-support"] }
lifescape-orch-stats = { path = "../orch-stats", features = ["test-support"] }

[lints]
workspace = true
