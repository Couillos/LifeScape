[package]
name = "lifescape-sdk"
version = "0.1.0"
edition = "2021"

[lib]
name = "lifescape_sdk"
path = "src/lib.rs"

[features]
# Test builds only (dev-dependency of every crate that drives a Bot): the
# failure dossiers go to a temp dir, never the real `run/failures`.
test-isolation = []

[lints]
workspace = true

[dependencies]
lifescape-json = { path = "../json" }
lifescape-nav = { path = "../nav" }
