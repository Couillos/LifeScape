[package]
name = "lifescape-orch-fleet"
version = "0.1.0"
edition = "2021"

[lib]
name = "lifescape_orch_fleet"
path = "src/lib.rs"

[dependencies]
lifescape-json = { path = "../json" }
lifescape-scripts = { path = "../scripts" }
lifescape-planner = { path = "../planner" }
lifescape-orch-core = { path = "../orch-core" }

[dev-dependencies]
# Test isolation (see orch-core `test-isolation`): run/ state resolves to a temp root.
lifescape-orch-core = { path = "../orch-core", features = ["test-isolation"] }

[lints]
workspace = true
