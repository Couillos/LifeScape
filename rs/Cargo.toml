[workspace]
members = ["crates/sdk", "crates/gamedata", "crates/orchestrator", "crates/orch-daemon", "crates/orch-web", "crates/orch-brain", "crates/orch-session", "crates/orch-stats", "crates/orch-stats-model", "crates/orch-market", "crates/orch-fleet", "crates/orch-world", "crates/orch-core", "crates/scripts", "crates/json", "crates/nav", "crates/store", "crates/market", "crates/planner"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

# Everything builds in release (user decision 2026-11-14): the daemon and
# the workers run rs/target/release/orchestrator. The dev profile stays
# optimized for the rare debug build (unoptimized nav was ~5x slower).
[profile.dev]
opt-level = 1

[profile.dev.package.lifescape-nav]
opt-level = 3

[profile.dev.package.lifescape-sdk]
opt-level = 3

[profile.dev.package.lifescape-gamedata]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

# Release-optimised tests, incremental (user 2026-11-23): run them with
# `cargo test --profile release-test`; a small change recompiles in
# seconds. The shipped binary (`--release`, profile release) is unchanged.
[profile.release-test]
inherits = "release"
incremental = true
