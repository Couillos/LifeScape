<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectator — LifeScape bots</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; color: #eee; background: #000; margin: 0; padding: 12px; }
  a { color: #04A800; }
  #bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
  #bar h1 { font-size: 18px; margin: 0; }
  #topnav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .navlink { color: #04A800; text-decoration: none; border: 1px solid #444; border-radius: 3px; padding: 3px 9px; }
  .navlink:hover { background: #262626; }
  .navlink[aria-current="page"] { color: #ff0; border-color: #ff0; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 14px; margin: 12px 0 4px; color: #ff0; }
  #layout { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  #list { min-width: 250px; max-width: 420px; flex: 1 1 250px; }
  /* Item table: click = pick, header click = sort the whole list. */
  #itemswrap { margin: 8px 0; max-height: 56vh; overflow: auto; }
  #items { border-collapse: collapse; font-size: 12px; width: 100%; }
  #items td, #items th { border: 1px solid #333; padding: 2px 8px; text-align: right; white-space: nowrap; }
  #items th { color: #888; font-weight: normal; }
  #items td.left, #items th.left { text-align: left; }
  #items tr[data-id] { cursor: pointer; }
  #items tr[data-id]:hover { background: #1a1a1a; }
  #items tr.cur { font-weight: bold; color: #ff0; }
  #recent td.item-link { cursor: pointer; text-decoration: underline dotted; }
  #recent td.item-link:hover { color: #ff0; }
  #items .up { color: #4caf50; }
  #items .down { color: #e05252; }
  #search { width: 100%; box-sizing: border-box; padding: 4px 6px; background: #0a0a0a; color: #eee; border: 1px solid #444; }
  #pager { display: flex; gap: 8px; align-items: center; color: #888; margin-top: 4px; }
  #pager button { background: #1b1b1b; color: #eee; border: 1px solid #444; padding: 2px 8px; cursor: pointer; }
  #detail { flex: 2 1 520px; min-width: 340px; }
  #views button { background: #1b1b1b; color: #eee; border: 1px solid #444; padding: 2px 8px; cursor: pointer; }
  #views button.cur { border-color: #ff0; color: #ff0; }
  canvas { background: #111; border: 1px solid #444; width: 100%; height: auto; display: block; }
  #tables { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
  #tables table { border-collapse: collapse; font-size: 12px; }
  #tables td, #tables th { border: 1px solid #333; padding: 2px 8px; text-align: right; }
  #tables th { color: #888; font-weight: normal; }
  #book tr.ask td:first-child { color: #e05252; }
  #book tr.bid td:first-child { color: #4caf50; }
  #book tr.spread td { color: #888; text-align: center; }
  .muted { color: #888; }
</style>
</head>
<body>
<div id="bar">
  <div style="display:flex;gap:12px;align-items:center">
    <h1>Spectator <span class="muted">— LifeScape bots</span></h1>
    <nav id="topnav" aria-label="Sections"><a class="navlink" href="/">Bots</a><a class="navlink" href="/items">Item holdings</a><a class="navlink" href="/market" aria-current="page">Market</a><a class="navlink" href="/rates">Rates</a><a class="navlink" href="/life">Lives</a><a class="navlink" href="/economy">Economy</a><a class="navlink" href="/errors">Errors</a></nav>
  </div>
</div>
<h1>Market <span class="muted">· candles over volume bars</span></h1>
<div id="layout">
  <div id="list">
    <h2>Items</h2>
    <input id="search" placeholder="Search an item…" autocomplete="off" oninput="onSearch()">
    <div class="muted">traded items only — most traded first, click a header to sort</div>
    <div id="itemswrap"><table id="items"></table></div>
    <div id="pager">
      <button onclick="page(-1)">‹</button>
      <span id="pageinfo"></span>
      <button onclick="page(1)">›</button>
    </div>
  </div>
  <div id="detail">
    <h2 id="title">Pick an item</h2>
    <div id="views">
      <button id="v-hour" class="cur" onclick="setView('hour')">24 h / hour</button>
      <button id="v-day" onclick="setView('day')">6 months / day</button>
      <span id="refline" class="muted"></span>
    </div>
    <canvas id="chart" width="720" height="340"></canvas>
    <div id="tables">
      <div><h2>Book</h2><table id="book"></table></div>
      <div><h2>Last trades</h2><table id="trades"></table></div>
      <div><h2>Latest transactions</h2><table id="recent"></table><div class="muted">all items, live · buyer/seller from the backend feed</div></div>
    </div>
  </div>
</div>
<script src="/chart.js"></script>
<script src="/table.js"></script>
<script src="/market.js"></script>
</body>
</html>
