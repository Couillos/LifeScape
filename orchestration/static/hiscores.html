<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiscores — LifeScape bots</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; color: #eee; background: #000; margin: 0; padding: 12px; }
  a { color: #04A800; }
  .muted { color: #888; }
  #bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
  #bar h1 { font-size: 18px; margin: 0; }
  #topnav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .navlink { color: #04A800; text-decoration: none; border: 1px solid #444; border-radius: 3px; padding: 3px 9px; }
  .navlink:hover { background: #262626; }
  .navlink[aria-current="page"] { color: #ff0; border-color: #ff0; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 14px; margin: 12px 0 4px; color: #ff0; }
  h3 { font-size: 13px; margin: 12px 0 4px; color: #ff0; font-weight: normal; }
  #status { margin: 0 0 6px; }
  #errors { display: none; color: #ff1744; margin: 0 0 6px; }
  #layout { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  #side { flex: 0 0 190px; }
  #board { flex: 1 1 520px; min-width: 300px; }
  /* Categories: one table, one row per ranking, the current one in yellow. */
  #cats { border-collapse: collapse; font-size: 12px; width: 100%; }
  #cats td, #cats th { border: 1px solid #333; padding: 2px 8px; text-align: left; }
  #cats th { color: #888; font-weight: normal; }
  #cats td:hover { background: #1a1a1a; }
  a.cat { display: block; color: #04A800; text-decoration: none; }
  #cats td.cur { font-weight: bold; }
  #cats td.cur a.cat { color: #ff0; }
  #side form { display: flex; gap: 4px; margin-bottom: 6px; }
  #side input { flex: 1 1 auto; min-width: 0; box-sizing: border-box; padding: 3px 6px; background: #0a0a0a; color: #eee; border: 1px solid #444; }
  #side button, .pager .btn { background: #1b1b1b; color: #eee; border: 1px solid #444; padding: 2px 8px; cursor: pointer; text-decoration: none; }
  .pager .btn.off { color: #555; cursor: default; }
  h2.scroll-title { margin-top: 0; }
  h3.scroll-sub { margin-top: 14px; }
  .note { color: #888; margin: 2px 0 6px; }
  .note.warn { color: #ff1744; }
  table.ranks { border-collapse: collapse; font-size: 12px; width: 100%; }
  table.ranks td, table.ranks th { border: 1px solid #333; padding: 2px 8px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.ranks th { color: #888; font-weight: normal; }
  table.ranks .left { text-align: left; }
  table.ranks tbody tr:hover { background: #1a1a1a; }
  table.ranks tr.hit { font-weight: bold; color: #ff0; }
  .tag { font-size: 10px; border: 1px solid #555; color: #888; border-radius: 6px; padding: 0 4px; vertical-align: 1px; }
  .tag.off { border-style: dashed; }
  .pager { display: flex; gap: 8px; align-items: center; color: #888; margin-top: 6px; }
  @media (max-width: 720px) {
    #side, #board { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div id="bar">
  <div style="display:flex;gap:12px;align-items:center">
    <h1>Spectator <span class="muted">— LifeScape bots</span></h1>
    <nav id="topnav" aria-label="Sections"><a class="navlink" href="/">Bots</a><a class="navlink" href="/items">Item holdings</a><a class="navlink" href="/market">Market</a><a class="navlink" href="/rates">Rates</a><a class="navlink" href="/guides-money">Money guide</a><a class="navlink" href="/guides-training">Training guide</a><a class="navlink" href="/life">Lives</a><a class="navlink" href="/economy">Economy</a><a class="navlink" href="/hiscores" aria-current="page">Hiscores</a><a class="navlink" href="/xp">XP</a><a class="navlink" href="/errors">Errors</a></nav>
  </div>
</div>
<h1>Hiscores <span class="muted" id="status">loading…</span></h1>
<div id="errors"></div>
<div id="layout">
  <div id="side">
    <table id="cats"></table>
    <h2>Search</h2>
    <form id="byname" autocomplete="off"><input id="name" maxlength="24" placeholder="Player name" aria-label="Player name"><button type="submit">Go</button></form>
    <form id="byrank" autocomplete="off"><input id="rank" type="number" min="1" placeholder="Rank" aria-label="Rank"><button type="submit">Go</button></form>
  </div>
  <div id="board"></div>
</div>
<script src="/hiscores.js"></script>
</body>
</html>
