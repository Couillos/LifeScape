<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectator - LifeScape bots</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; color: #eee; background: #000; margin: 0; padding: 12px; }
  a { color: #04A800; }
  .navlink { color: #04A800; text-decoration: none; border: 1px solid #444; border-radius: 3px; padding: 3px 9px; }
  .navlink:hover { background: #262626; }
  .navlink[aria-current="page"] { color: #ff0; border-color: #ff0; }
  #topnav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 13px; margin: 10px 0 4px; color: #ff0; font-weight: 700; }
  #bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
  #bar button { line-height: 18px; }
  button { font: inherit; color: #eee; background: #1b1b1b; border: 1px solid #444; border-radius: 3px; padding: 3px 9px; cursor: pointer; }
  button:hover { background: #262626; }
  button:disabled { opacity: 0.45; cursor: default; }
  #controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; background: #0a0a0a; border: 1px solid #333; padding: 6px 8px; margin-bottom: 10px; }
  #controls > div { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #controls input, #controls select { font: inherit; color: #eee; background: #000; border: 1px solid #444; border-radius: 3px; padding: 3px 6px; }
  #controls select { max-width: 200px; }
  #controls #args { width: 170px; }
  #controls #args { width: 170px; }
  #controls .sep { color: #555; }
  #ctlmsg { color: #d9a441; min-height: 1em; }
  #layout { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  /* Sessions list: always visible on the left on PC, drawer on mobile only. */
  #list { width: 280px; flex: 0 0 280px; background: #050505; border: 1px solid #444; padding: 12px; margin: 0; overflow-y: auto; max-height: calc(100vh - 24px); position: sticky; top: 12px; box-sizing: border-box; }
  #toggle, #drawer-close { display: none; }
  #list ul { list-style: none; padding: 0; margin: 8px 0; }
  @media (max-width: 768px) {
    #list { position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; width: 280px; max-width: 85vw; flex: none; max-height: none; border-right: 1px solid #444; border-top: 0; border-bottom: 0; border-left: 0; }
    body.list-hidden #list { transform: translateX(-105%); }
    #toggle, #drawer-close { display: inline-block; }
    /* Mobile block order: canvas, infotext, dialogue, message, inventory,
       skills, scenery, log. Columns dissolve so blocks order directly. */
    #layout { flex-direction: column; }
    #left, #center, #mid, #side { display: contents; }
    .block { width: 100%; max-width: none; }
    .b-canvas { order: 1; } .b-info { order: 2; } .b-dialog { order: 3; }
    .b-msg { order: 4; } .b-inv { order: 5; } .b-skills { order: 6; }
    .b-scenery { order: 7; } .b-log { order: 8; }
  }
  #list li { margin: 3px 0; }
  #list li a { text-decoration: none; }
  #list li a.cur { font-weight: bold; color: #ff0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: #555; }
  .running { background: #46c46f; } .reconnecting, .busy, .starting { background: #d9a441; }
  .failed, .disconnected { background: #e05a5a; } .finished, .stopped { background: #6b7280; }
  .pill { font-size: 11px; font-weight: 700; padding: 1px 9px; border-radius: 9px; margin-left: 8px; vertical-align: 1px; }
  .pill.running { background: #46c46f; color: #000; } .pill.crashed { background: #e05a5a; color: #000; }
  .pill.paused { background: #d9a441; color: #000; } .pill.stopped { background: #6b7280; color: #000; }
  .pill.empty { background: none; border: 1px solid #555; color: #888; }
  #left { flex: 1 1 260px; min-width: 250px; max-width: 560px; }
  #center { flex: 2 1 420px; min-width: 300px; max-width: 560px; }
  #mid { flex: 1 1 260px; min-width: 240px; max-width: 420px; }
  #title { color: #888; margin-bottom: 6px; }
  #zonename { color: #ff0; margin-left: 8px; }
  canvas { background: #111; border: 1px solid #444; image-rendering: pixelated; width: 100%; max-width: 560px; aspect-ratio: 1; display: block; box-sizing: border-box; }
  #layout .panel { max-width: 560px; box-sizing: border-box; }
  #side { flex: 1 1 260px; min-width: 240px; max-width: 420px; }
  .panel { background: #0a0a0a; border: 1px solid #333; padding: 6px; margin-top: 6px; max-height: 200px; overflow-y: auto; font-size: 12px; }
  .panel pre { white-space: pre-wrap; margin: 0; font-family: monospace; }
  .logpanel { background: none; border: 0; padding: 0; max-height: none; overflow: visible; }
  #log { max-height: 260px; overflow-y: auto; padding: 6px; border: 1px solid #333; background: #0a0a0a; }
  .muted { color: #888; }
  @media (max-width: 900px) {
    #layout { flex-direction: column; }
    #left, #center, #mid, #side { max-width: none; width: 100%; flex: 1 1 auto; }
  }
</style>
</head>
<body class="list-hidden">
<div id="bar">
  <div style="display:flex;gap:12px;align-items:center">
    <button id="toggle" onclick="window.spectator.toggle()" aria-expanded="true" title="Show/hide sessions">☰ Sessions</button>
    <button id="rtbtn" title="Limit canvas redraws to once per second (default). Real-time redraws every frame.">Real-time: off</button>
    <h1>Spectator <span class="muted">— LifeScape bots</span></h1>
    <nav id="topnav" aria-label="Sections"><a class="navlink" href="/" aria-current="page">Bots</a><a class="navlink" href="/items">Item holdings</a><a class="navlink" href="/market">Market</a><a class="navlink" href="/rates">Rates</a><a class="navlink" href="/life">Lives</a><a class="navlink" href="/economy">Economy</a></nav>
  </div>
</div>
<div id="controls">
  <div id="open-block">
    <select id="account" title="Session account for open"></select>
    <button id="btn-open" title="Create a session: log the player in">open</button>
  </div>
  <span class="sep">|</span>
  <div id="script-block">
    <select id="script" title="Script to launch"></select>
    <input id="args" placeholder="args…" title="Script args, space-separated (JSON when it parses)">
    <button id="btn-run" title="Launch the script in the session">run</button>
    <button id="btn-stop" title="Stop the script, keep the session connected">stop</button>
    <button id="btn-pause-toggle" title="Freeze the script, keep the connection">pause</button>
  </div>
  <span id="ctlmsg"></span>
</div>
<div id="layout">
  <div id="list">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div><span id="count">0</span> bot(s) supervised</div>
      <button id="drawer-close" title="Close sessions">×</button>
    </div>
    <ul id="players"><li class="muted">loading…</li></ul>
  </div>
  <div id="left">
    <div class="block b-info"><div class="panel"><pre id="infotext"></pre></div></div>
    <div class="block b-log"><h2>Log</h2><div class="panel logpanel"><pre id="log"></pre></div></div>
  </div>
  <div id="center">
    <div class="block b-canvas"><div id="title" class="muted"><span id="titletext">Click a bot to follow it.</span><span id="scriptpill" class="pill" style="display:none"></span><span id="scriptname" class="pill empty" style="display:none"></span><span id="zonename"></span> <button id="btn-close" title="Cut the session: log out and drop the connection">close</button></div><canvas id="map" width="560" height="560"></canvas></div>
  </div>
  <div id="mid">
    <div class="block b-dialog"><h2>Dialogue / window</h2><div class="panel"><pre id="dialog"></pre></div></div>
    <div class="block b-msg"><h2>Messages</h2><div class="panel"><pre id="chat"></pre></div></div>
    <div class="block b-scenery"><h2>Scenery &amp; ground items</h2><div class="panel"><pre id="scenery"></pre></div></div>
  </div>
  <div id="side">
    <div class="block b-inv"><h2 id="invtitle">Inventory</h2><div class="panel"><pre id="inv"></pre></div></div>
    <div class="block b-skills"><h2>Skills</h2><div class="panel"><pre id="skills"></pre></div></div>
  </div>
</div>
<script src="/spectator.js"></script>
</body>
</html>
